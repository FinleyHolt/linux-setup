# tmux, linked to ~/.config/tmux/tmux.conf by `setup.sh dotfiles`.

# The wheel scrolls tmux's own history (copy mode; q or Esc leaves it). With
# mouse off, the terminal turns the wheel into arrow keys inside tmux, which
# steps through shell history instead of scrolling. A drag selects and copies;
# hold Shift to use the terminal's own selection instead.
set -g mouse on

# Copies leave as OSC 52, so a selection on a remote host lands in the local
# clipboard through ssh or mosh (Ghostty allows clipboard writes by default).
set -g set-clipboard on

# Room to scroll back through long output. Applies to panes opened after this
# loads; running panes keep the limit they started with.
set -g history-limit 50000
