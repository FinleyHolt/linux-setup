# GNOME settings, applied with `dconf load / < gnome/settings.ini`.
# Keys a GNOME version or extension does not know are stored and ignored.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
accent-color='blue'
enable-hot-corners=true
show-battery-percentage=true

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true

[org/gnome/desktop/background]
picture-options='zoom'

[org/gnome/shell]
disable-user-extensions=false

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
height-fraction=0.9
dash-max-icon-size=80
multi-monitor=true
transparency-mode='FIXED'
background-opacity=0.25
custom-background-color=true
background-color='rgb(153,193,241)'
disable-overview-on-startup=true

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
static-blur=true
style-dash-to-dock=0
pipeline='pipeline_default_rounded'
brightness=0.6
sigma=30

[org/gnome/shell/extensions/blur-my-shell/panel]
brightness=0.6
sigma=30

[org/gnome/shell/extensions/blur-my-shell/appfolder]
brightness=0.6
sigma=30

[org/gnome/shell/extensions/custom-hot-corners-extended/monitor-0-bottom-right-0]
action='toggle-overview'

[org/gnome/shell/extensions/tiling-assistant]
window-gap=0

# Ubuntu's desktop-icons extension: no home folder on the desktop.
[org/gnome/shell/extensions/ding]
show-home=false
